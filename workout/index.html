<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e52b2b">
<title>筋トレ記録</title>
<style>
:root{
  --red:#e52b2b; --red-l:#ff6b6b; --green:#2ec41e; --bg:#ececec; --card:#fff;
  --text:#111; --sub:#9a9a9a; --line:#e2e2e2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

/* header */
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;position:sticky;top:0;z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px}
.bar h1{font-size:20px;margin:0;font-weight:700}
.pill{background:var(--red-l);border-radius:26px;height:44px;min-width:44px;padding:0 16px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stat{border:2px solid #fff;border-radius:10px;text-align:center;padding:6px 2px}
.stat small{display:block;font-size:11px;font-weight:700}
.stat b{font-size:20px}

/* calendar */
.cal{background:var(--card);margin:12px;border-radius:16px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:18px}
.cal-head button{font-size:22px;width:40px;height:40px;border-radius:20px;background:#f3f3f3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--sub);padding:4px 0}
.dow:first-child{color:var(--red)} .dow:last-child{color:#2a6bd8}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:15px;position:relative}
.day.other{visibility:hidden}
.day.today{outline:2px solid var(--red);outline-offset:-2px}
.day.done{background:var(--red);color:#fff;font-weight:700}
.day .dots{position:absolute;bottom:3px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:#fff}
.legend{font-size:12px;color:var(--sub);margin-top:8px;text-align:right}
.month-sum{margin:0 12px;background:var(--card);border-radius:16px;padding:12px;font-size:14px;display:flex;justify-content:space-around}
.month-sum div{text-align:center} .month-sum b{display:block;font-size:20px;color:var(--red)}
.big-btn{display:block;width:calc(100% - 24px);margin:16px 12px;background:var(--red);color:#fff;font-size:18px;font-weight:700;padding:16px;border-radius:30px;box-shadow:0 3px 8px rgba(229,43,43,.35)}
.tools{display:flex;gap:8px;margin:0 12px 30px}
.tools button,.tools label{flex:1;text-align:center;background:#fff;border-radius:12px;padding:10px;font-size:13px;color:#555}

/* exercise cards */
#list{padding:12px 12px 120px}
.card{background:var(--card);border-radius:18px;margin-bottom:16px;overflow:hidden}
.card-h{background:var(--red);color:#fff;display:flex;align-items:center;padding:10px 14px;gap:6px}
.card-h .name{flex:1;font-size:18px;font-weight:700}
.card-h .part{font-size:11px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px}
.card-h button{color:#fff;font-size:18px;width:32px;height:32px}
.card-h button:disabled{opacity:.35}
.cols,.row{display:grid;grid-template-columns:30px 1fr 64px 72px 36px;align-items:center;gap:6px;padding:0 12px}
.cols{font-size:11px;color:var(--sub);padding-top:6px;padding-bottom:2px}
.row{border-bottom:1px solid var(--line);height:56px}
.row .no{font-size:18px}
.row .w,.row .r{display:flex;align-items:baseline;gap:3px}
.row input{width:100%;border:none;border-bottom:1px solid transparent;background:transparent;font-size:22px;font-weight:700;text-align:right;padding:2px 0;outline:none}
.row input:focus{border-bottom-color:var(--red)}
.row input::placeholder{color:#ccc;font-weight:400}
.row .u{font-size:12px;color:#666}
.row .rm{font-size:14px;text-align:right}
.row .del{font-size:18px;color:#aaa}
.add-set{display:flex;justify-content:center;padding:10px}
.add-set button{width:44px;height:44px;border-radius:50%;background:#e4e4e4;color:#fff;font-size:30px;line-height:44px}
.prev{font-size:11px;color:var(--sub);padding:4px 14px 0}
.empty{text-align:center;color:var(--sub);margin-top:60px;line-height:1.8}

.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;line-height:64px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:20}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:85vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.sheet-h b{font-size:18px}
.sheet-h button{font-size:22px;color:#888}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:0 12px 10px}
.tabs button{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:#f0f0f0;font-weight:700}
.tabs button.on{background:var(--red);color:#fff}
.ex-list{overflow-y:auto;flex:1;padding:0 12px}
.ex{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.ex button.pick{flex:1;text-align:left;padding:15px 6px;font-size:16px}
.ex .tag{font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:8px;padding:1px 6px;margin-left:6px}
.ex .rm-ex{color:#bbb;padding:10px}
.custom{display:flex;gap:8px;padding:12px}
.custom input{flex:1;border:1px solid #ccc;border-radius:10px;padding:10px;font-size:16px}
.custom button{background:var(--red);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60}
</style>
</head>
<body>

<!-- ===== カレンダー画面 ===== -->
<section id="home">
  <header>
    <div class="bar"><span style="width:44px"></span><h1>筋トレ記録</h1><span style="width:44px"></span></div>
  </header>
  <div class="cal">
    <div class="cal-head">
      <button id="prevM">‹</button><b id="monthLabel"></b><button id="nextM">›</button>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="legend"><span style="color:var(--red)">●</span> = トレーニング日（日付をタップで記録を開く）</div>
  </div>
  <div class="month-sum">
    <div>今月の日数<b id="mDays">0</b></div>
    <div>今月のセット<b id="mSets">0</b></div>
    <div>今月の負荷(kg)<b id="mLoad">0</b></div>
  </div>
  <button class="big-btn" id="todayBtn">＋ 今日のトレーニングを追加</button>
  <div class="tools">
    <button id="exportBtn">バックアップ保存</button>
    <label>バックアップ読込<input type="file" id="importFile" accept="application/json" hidden></label>
  </div>
</section>

<!-- ===== 1日の記録画面 ===== -->
<section id="dayView" class="hidden">
  <header>
    <div class="bar">
      <button class="pill" id="backBtn">‹</button>
      <h1 id="dayLabel"></h1>
      <span style="width:44px"></span>
    </div>
    <div class="stats">
      <div class="stat"><small>合計種目数</small><b id="sEx">0</b></div>
      <div class="stat"><small>合計セット数</small><b id="sSet">0</b></div>
      <div class="stat"><small>合計レップ数</small><b id="sRep">0</b></div>
      <div class="stat"><small>合計負荷(kg)</small><b id="sLoad">0</b></div>
    </div>
  </header>
  <div id="list"></div>
  <button class="fab" id="fab">＋</button>
</section>

<!-- ===== 種目選択 ===== -->
<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheet-h"><b>種目を追加</b><button id="closeModal">✕</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="ex-list" id="exList"></div>
    <div class="custom">
      <input id="customName" placeholder="この部位に種目を追加（例：ケーブルフライ）">
      <button id="addCustom">追加</button>
    </div>
  </div>
</div>

<script>
const PARTS = {
  "胸":   ["ベンチプレス","インクラインベンチプレス","ダンベルプレス","インクラインダンベルプレス","ダンベルフライ","チェストプレス","ペックフライ","ケーブルクロスオーバー","ディップス","腕立て伏せ"],
  "背中": ["デッドリフト","懸垂（チンニング）","ラットプルダウン","ベントオーバーロウ","ワンハンドダンベルロウ","シーテッドロウ","Tバーロウ","マシンロウ","バックエクステンション"],
  "肩":   ["ショルダープレス","ダンベルショルダープレス","サイドレイズ","マシン サイドレイズ","フロントレイズ","リアレイズ","リアデルトフライ","アップライトロウ","フェイスプル"],
  "二頭": ["バーベルカール","ダンベルカール","ハンマーカール","インクラインダンベルカール","プリーチャーカール","コンセントレーションカール","ケーブルカール"],
  "三頭": ["ナローベンチプレス","フレンチプレス","スカルクラッシャー","トライセプスプッシュダウン","ダンベルキックバック","オーバーヘッドエクステンション","ディップス（三頭）"],
  "脚":   ["スクワット","レッグプレス","ブルガリアンスクワット","ランジ","レッグエクステンション","レッグカール","ルーマニアンデッドリフト","ヒップスラスト","カーフレイズ","アダクション","アブダクション"]
};
const KEY = "kintore-log-v1";
let db = load();
let viewMonth = new Date(); viewMonth.setDate(1);
let curDate = null;
let curPart = "胸";

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.logs) return d; }catch(e){}
  return {logs:{}, custom:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("保存に失敗しました"); } }
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const rm  = (w,r) => (w>0 && r>0) ? (r===1 ? w : w*(1+r/40)) : 0;   // 1RM推定
const fmt = n => (Math.round(n*100)/100).toLocaleString();
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1600); }

function dayTotals(list){
  let sets=0, reps=0, load=0;
  (list||[]).forEach(ex=>ex.sets.forEach(s=>{
    const w=num(s.w), r=num(s.r);
    if(r>0){ sets++; reps+=r; load+=w*r; }
  }));
  return {ex:(list||[]).length, sets, reps, load};
}
const trained = date => (db.logs[date]||[]).length>0;

/* ---------- カレンダー ---------- */
function renderCal(){
  const y=viewMonth.getFullYear(), m=viewMonth.getMonth();
  $("monthLabel").textContent = `${y}年 ${m+1}月`;
  const g=$("calGrid"); g.innerHTML="";
  "日月火水木金土".split("").forEach(d=>{ const e=document.createElement("div"); e.className="dow"; e.textContent=d; g.appendChild(e); });
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), today=ymd(new Date());
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="day other"; g.appendChild(e); }
  let mDays=0,mSets=0,mLoad=0;
  for(let d=1; d<=days; d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const e=document.createElement("button"); e.className="day"; e.textContent=d;
    if(key===today) e.classList.add("today");
    if(trained(key)){
      e.classList.add("done");
      const t=dayTotals(db.logs[key]); mDays++; mSets+=t.sets; mLoad+=t.load;
    }
    e.onclick=()=>openDay(key);
    g.appendChild(e);
  }
  $("mDays").textContent=mDays; $("mSets").textContent=mSets; $("mLoad").textContent=fmt(mLoad);
}
$("prevM").onclick=()=>{ viewMonth.setMonth(viewMonth.getMonth()-1); renderCal(); };
$("nextM").onclick=()=>{ viewMonth.setMonth(viewMonth.getMonth()+1); renderCal(); };
$("todayBtn").onclick=()=>openDay(ymd(new Date()));

/* ---------- 1日の記録 ---------- */
function openDay(date){
  curDate=date;
  const [y,m,d]=date.split("-");
  $("dayLabel").textContent=`${y}/${m}/${d}`;
  $("home").classList.add("hidden"); $("dayView").classList.remove("hidden");
  window.scrollTo(0,0);
  renderDay();
}
$("backBtn").onclick=()=>{
  if(db.logs[curDate] && !db.logs[curDate].length){ delete db.logs[curDate]; save(); }
  $("dayView").classList.add("hidden"); $("home").classList.remove("hidden");
  const [y,m]=curDate.split("-"); viewMonth=new Date(+y,+m-1,1);
  renderCal();
};

function lastRecord(name){
  const dates=Object.keys(db.logs).filter(d=>d<curDate).sort().reverse();
  for(const d of dates){ const ex=db.logs[d].find(e=>e.name===name); if(ex) return {date:d, ex}; }
  return null;
}

function updateStats(){
  const t=dayTotals(db.logs[curDate]);
  $("sEx").textContent=t.ex; $("sSet").textContent=t.sets; $("sRep").textContent=t.reps; $("sLoad").textContent=fmt(t.load);
}

function renderDay(){
  const list=db.logs[curDate]||[];
  const box=$("list"); box.innerHTML="";
  if(!list.length){
    box.innerHTML=`<div class="empty">まだ種目がありません<br>右下の <b style="color:var(--green)">＋</b> から種目を追加</div>`;
  }
  list.forEach((ex,i)=>{
    const c=document.createElement("div"); c.className="card";
    const prev=lastRecord(ex.name);
    const prevTxt = prev ? `前回 ${prev.date.slice(5).replace("-","/")}：` + prev.ex.sets.filter(s=>num(s.r)>0).map(s=>`${num(s.w)}kg×${num(s.r)}`).join(" / ") : "";
    c.innerHTML=`
      <div class="card-h">
        <span class="name">${esc(ex.name)}</span><span class="part">${esc(ex.part||"")}</span>
        <button data-a="up" ${i===0?"disabled":""}>▲</button>
        <button data-a="down" ${i===list.length-1?"disabled":""}>▼</button>
        <button data-a="delEx">✕</button>
      </div>
      ${prevTxt?`<div class="prev">${esc(prevTxt)}</div>`:""}
      <div class="cols"><span>セット</span><span style="text-align:right">重さ</span><span style="text-align:right">回数</span><span style="text-align:right">RM</span><span></span></div>
      <div class="rows"></div>
      <div class="add-set"><button data-a="addSet">＋</button></div>`;
    const rows=c.querySelector(".rows");
    ex.sets.forEach((s,j)=>{
      const r=document.createElement("div"); r.className="row";
      const ph = prev && prev.ex.sets[j] ? prev.ex.sets[j] : null;
      r.innerHTML=`
        <span class="no">${j+1}</span>
        <span class="w"><input inputmode="decimal" value="${s.w??""}" placeholder="${ph&&ph.w?ph.w:"0"}"><span class="u">kg</span></span>
        <span class="r"><input inputmode="numeric" value="${s.r??""}" placeholder="${ph&&ph.r?ph.r:"0"}"><span class="u">回</span></span>
        <span class="rm">${rm(num(s.w),num(s.r))?fmt(rm(num(s.w),num(s.r)))+"kg":"-"}</span>
        <button class="del">🗑</button>`;
      const [wIn,rIn]=r.querySelectorAll("input");
      const upd=()=>{ s.w=wIn.value; s.r=rIn.value; const v=rm(num(s.w),num(s.r)); r.querySelector(".rm").textContent=v?fmt(v)+"kg":"-"; save(); updateStats(); };
      wIn.oninput=upd; rIn.oninput=upd;
      r.querySelector(".del").onclick=()=>{ ex.sets.splice(j,1); save(); renderDay(); };
      rows.appendChild(r);
    });
    c.querySelector('[data-a="addSet"]').onclick=()=>{
      const last=ex.sets[ex.sets.length-1];
      ex.sets.push({w:last?last.w:"", r:""}); save(); renderDay();
    };
    c.querySelector('[data-a="delEx"]').onclick=()=>{
      if(confirm(`「${ex.name}」を削除しますか？`)){ list.splice(i,1); save(); renderDay(); }
    };
    c.querySelector('[data-a="up"]').onclick=()=>{ [list[i-1],list[i]]=[list[i],list[i-1]]; save(); renderDay(); };
    c.querySelector('[data-a="down"]').onclick=()=>{ [list[i+1],list[i]]=[list[i],list[i+1]]; save(); renderDay(); };
    box.appendChild(c);
  });
  updateStats();
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- 種目選択 ---------- */
$("fab").onclick=()=>{ $("modal").classList.remove("hidden"); renderTabs(); renderExList(); };
$("closeModal").onclick=()=>$("modal").classList.add("hidden");
$("modal").onclick=e=>{ if(e.target.id==="modal") $("modal").classList.add("hidden"); };

function renderTabs(){
  const t=$("tabs"); t.innerHTML="";
  Object.keys(PARTS).forEach(p=>{
    const b=document.createElement("button"); b.textContent=p; if(p===curPart) b.className="on";
    b.onclick=()=>{ curPart=p; renderTabs(); renderExList(); };
    t.appendChild(b);
  });
}
function renderExList(){
  const box=$("exList"); box.innerHTML="";
  const custom=db.custom[curPart]||[];
  [...custom.map(n=>({n,c:true})), ...PARTS[curPart].map(n=>({n,c:false}))].forEach(({n,c})=>{
    const row=document.createElement("div"); row.className="ex";
    row.innerHTML=`<button class="pick">${esc(n)}${c?'<span class="tag">マイ種目</span>':""}</button>${c?'<button class="rm-ex">🗑</button>':""}`;
    row.querySelector(".pick").onclick=()=>addExercise(n);
    if(c) row.querySelector(".rm-ex").onclick=()=>{
      if(confirm(`マイ種目「${n}」を一覧から削除しますか？（過去の記録は残ります）`)){
        db.custom[curPart]=custom.filter(x=>x!==n); save(); renderExList();
      }
    };
    box.appendChild(row);
  });
}
$("addCustom").onclick=()=>{
  const n=$("customName").value.trim(); if(!n) return;
  db.custom[curPart]=db.custom[curPart]||[];
  if(db.custom[curPart].includes(n)||PARTS[curPart].includes(n)){ toast("すでにあります"); return; }
  db.custom[curPart].unshift(n); save(); $("customName").value=""; renderExList(); toast(`「${n}」を追加しました`);
};
function addExercise(name){
  db.logs[curDate]=db.logs[curDate]||[];
  const prev=lastRecord(name);
  const sets=[0,1,2].map(i=>({w: prev&&prev.ex.sets[i]?prev.ex.sets[i].w:"", r:""}));
  db.logs[curDate].push({name, part:curPart, sets});
  save(); $("modal").classList.add("hidden"); renderDay();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50);
}

/* ---------- バックアップ ---------- */
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`kintore-backup-${ymd(new Date())}.json`; a.click();
};
$("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{
    try{ const d=JSON.parse(t); if(!d.logs) throw 0;
      if(confirm("現在のデータを置き換えて読み込みますか？")){ db={logs:d.logs, custom:d.custom||{}}; save(); renderCal(); toast("読み込みました"); }
    }catch(_){ toast("ファイルが正しくありません"); }
  });
  e.target.value="";
};

renderCal();
</script>
</body>
</html>
