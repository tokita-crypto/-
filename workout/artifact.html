<title>筋トレ記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
/* Iron & fire: 鋼のダーク地に溶鉄オレンジ。数字は角ばった縦長書体でスコアボード風 */
:root{
  --bg:#111214; --surface:#1b1c20; --surface2:#24262b; --line:#32343a;
  --text:#f3f1ee; --sub:#8c8e96; --accent:#ff6a13; --accent2:#ffb020; --danger:#ff4d4d;
  --num:"Bebas Neue","Oswald",Impact,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans",-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--jp)}
body{background:
  radial-gradient(120% 60% at 50% -10%, rgba(255,106,19,.10), transparent 60%),
  repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px),
  var(--bg);min-height:100vh}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.hidden{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:#0b0b0d}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:10px 14px 14px;
  background:linear-gradient(180deg,#0b0b0d,#17181b);
  border-bottom:2px solid var(--accent);box-shadow:0 6px 24px rgba(255,106,19,.18)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.bar h1{margin:0;font-family:var(--num);font-weight:400;font-size:30px;letter-spacing:2px}
.brand{text-align:center;line-height:1}
.brand .logo{font-family:var(--num);font-size:40px;letter-spacing:3px;
  background:linear-gradient(180deg,#fff 30%,var(--accent2) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--sub);letter-spacing:.4em;margin-top:2px}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:12px;height:44px;min-width:44px;padding:0 14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px 4px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:auto 0 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.stat small{display:block;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em}
.stat b{font-family:var(--num);font-weight:400;font-size:30px;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);margin:14px;border-radius:18px;padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-family:var(--num);font-weight:400;font-size:28px;letter-spacing:2px}
.cal-head button{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.dow{font-size:11px;color:var(--sub);padding:4px 0;font-weight:700}
.dow:first-child{color:var(--danger)} .dow:last-child{color:#5a9bff}
.day{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--num);font-size:20px;color:#c9cad0;position:relative}
.day.other{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 2px var(--text);color:var(--text)}
.day.done{color:#1a0d04;background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent) 60%,#c84300);
  box-shadow:0 0 12px rgba(255,106,19,.55),inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 0 6px rgba(255,255,255,.12)}
.day.done.today{box-shadow:0 0 0 2px var(--text),0 0 14px rgba(255,106,19,.7)}
.legend{font-size:11px;color:var(--sub);margin-top:10px;text-align:right}
.month-sum{margin:0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month-sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.month-sum b{display:block;font-family:var(--num);font-weight:400;font-size:34px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.big-btn{display:block;width:calc(100% - 28px);margin:18px 14px;padding:17px;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:.05em;color:#1a0d04;
  background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 6px 20px rgba(255,106,19,.4),inset 0 -3px 0 rgba(0,0,0,.2)}
.big-btn:active{transform:translateY(1px)}
.tools{display:flex;gap:8px;margin:0 14px 30px}
.tools button,.tools label{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;color:var(--sub);cursor:pointer}
.sync{font-size:11px;text-align:center;color:var(--sub);margin:-8px 14px 14px}

/* exercise cards */
#list{padding:14px 14px 130px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.card-h{display:flex;align-items:center;padding:12px 10px 12px 14px;gap:4px;
  background:linear-gradient(90deg,#2a2c31,#1e1f23);border-bottom:1px solid var(--line)}
.card-h .name{flex:1;font-size:17px;font-weight:900;min-width:0}
.card-h .part{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);padding:1px 8px;border-radius:6px}
.card-h button{color:var(--sub);font-size:15px;width:32px;height:32px}
.card-h button:disabled{opacity:.25}
.cols,.row{display:grid;grid-template-columns:34px 1fr 66px 74px 32px;align-items:center;gap:6px;padding:0 12px}
.cols{font-size:10px;color:var(--sub);padding-top:8px;padding-bottom:2px;font-weight:700;letter-spacing:.05em}
.row{border-bottom:1px solid var(--line);height:58px}
.row .no{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:18px;
  background:radial-gradient(circle,var(--surface) 28%,#3a3c42 30%,#2b2d32 70%);border:1px solid #45474e;color:var(--accent2)}
.row .w,.row .r{display:flex;align-items:baseline;gap:3px}
.row input{width:100%;border:none;border-bottom:2px solid transparent;background:transparent;font-family:var(--num);font-size:32px;line-height:1;text-align:right;padding:2px 0;outline:none}
.row input:focus{border-bottom-color:var(--accent)}
.row input::placeholder{color:#45474e}
.row .u{font-size:11px;color:var(--sub)}
.row .rm{font-family:var(--num);font-size:20px;text-align:right;color:var(--accent2)}
.row .del{font-size:16px;color:#5c5e66}
.add-set{padding:10px 12px 12px}
.add-set button{width:100%;padding:10px;border:1px dashed #4a4c53;border-radius:10px;color:var(--accent);font-weight:700;font-size:14px}
.prev{font-size:11px;color:var(--sub);padding:6px 14px 0}
.empty{text-align:center;color:var(--sub);margin-top:70px;line-height:1.9}
.empty .big{font-family:var(--num);font-size:44px;color:#3a3c42;letter-spacing:3px;display:block}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent) 65%,#c84300);color:#1a0d04;font-size:40px;font-weight:900;line-height:66px;
  box-shadow:0 0 0 4px rgba(255,106,19,.18),0 8px 22px rgba(255,106,19,.5);z-index:20}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--surface);border-top:2px solid var(--accent);width:100%;max-height:85vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.sheet-h b{font-size:17px;font-weight:900}
.sheet-h button{font-size:20px;color:var(--sub)}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:0 12px 12px}
.tabs button{flex:0 0 auto;padding:8px 18px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:700;color:#c9cad0}
.tabs button.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#1a0d04;border-color:transparent}
.ex-list{overflow-y:auto;flex:1;padding:0 12px}
.ex{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.ex button.pick{flex:1;text-align:left;padding:15px 6px;font-size:15px;font-weight:700}
.ex .tag{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px}
.ex .rm-ex{color:#5c5e66;padding:10px}
.custom{display:flex;gap:8px;padding:12px}
.custom input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
.custom button{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#1a0d04;border-radius:10px;padding:0 16px;font-weight:900}
.dlg-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:auto;padding:20px;width:min(320px,90vw);text-align:center}
.dlg-box p{margin:0 0 16px;font-size:15px;line-height:1.6}
.dlg-box .btns{display:flex;gap:10px}
.dlg-box .btns button{flex:1;padding:12px;border-radius:10px;background:var(--surface2);font-weight:700}
.dlg-box .btns .ok{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:12px;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){ .day.done{transition:transform .15s} .day:active{transform:scale(.92)} }
</style>
</head>
<body>

<!-- ===== カレンダー画面 ===== -->
<section id="home">
  <header>
    <div class="bar" style="justify-content:center"><div class="brand"><span class="logo">IRON LOG</span><small>筋トレ記録</small></div></div>
  </header>
  <div class="cal">
    <div class="cal-head">
      <button id="prevM">‹</button><b id="monthLabel"></b><button id="nextM">›</button>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="legend"><span style="color:var(--accent)">●</span> = トレーニング日（日付をタップで記録を開く）</div>
  </div>
  <div class="month-sum">
    <div>今月の日数<b id="mDays">0</b></div>
    <div>今月のセット<b id="mSets">0</b></div>
    <div>今月の負荷(kg)<b id="mLoad">0</b></div>
  </div>
  <button class="big-btn" id="todayBtn">＋ 今日のトレーニングを追加</button>
  <div class="sync" id="syncNote"></div>
  <div class="tools">
    <button id="exportBtn">バックアップ保存</button>
    <label>バックアップ読込<input type="file" id="importFile" accept="application/json" hidden></label>
  </div>
</section>

<!-- ===== 1日の記録画面 ===== -->
<section id="dayView" class="hidden">
  <header>
    <div class="bar">
      <button class="pill" id="backBtn">‹</button>
      <h1 id="dayLabel"></h1>
      <span style="width:44px"></span>
    </div>
    <div class="stats">
      <div class="stat"><small>合計種目数</small><b id="sEx">0</b></div>
      <div class="stat"><small>合計セット数</small><b id="sSet">0</b></div>
      <div class="stat"><small>合計レップ数</small><b id="sRep">0</b></div>
      <div class="stat"><small>合計負荷(kg)</small><b id="sLoad">0</b></div>
    </div>
  </header>
  <div id="list"></div>
  <button class="fab" id="fab">＋</button>
</section>

<!-- ===== 種目選択 ===== -->
<div class="modal hidden" id="dlg" style="align-items:center"><div class="dlg-box"><p id="dlgMsg"></p><div class="btns"><button id="dlgNo">キャンセル</button><button class="ok" id="dlgOk">OK</button></div></div></div>
<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheet-h"><b>種目を追加</b><button id="closeModal">✕</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="ex-list" id="exList"></div>
    <div class="custom">
      <input id="customName" placeholder="この部位に種目を追加（例：ケーブルフライ）">
      <button id="addCustom">追加</button>
    </div>
  </div>
</div>

<script>
const PARTS = {
  "胸":   ["ベンチプレス","インクラインベンチプレス","ダンベルプレス","インクラインダンベルプレス","ダンベルフライ","チェストプレス","ペックフライ","ケーブルクロスオーバー","ディップス","腕立て伏せ"],
  "背中": ["デッドリフト","懸垂（チンニング）","ラットプルダウン","ベントオーバーロウ","ワンハンドダンベルロウ","シーテッドロウ","Tバーロウ","マシンロウ","バックエクステンション"],
  "肩":   ["ショルダープレス","ダンベルショルダープレス","サイドレイズ","マシン サイドレイズ","フロントレイズ","リアレイズ","リアデルトフライ","アップライトロウ","フェイスプル"],
  "二頭": ["バーベルカール","ダンベルカール","ハンマーカール","インクラインダンベルカール","プリーチャーカール","コンセントレーションカール","ケーブルカール"],
  "三頭": ["ナローベンチプレス","フレンチプレス","スカルクラッシャー","トライセプスプッシュダウン","ダンベルキックバック","オーバーヘッドエクステンション","ディップス（三頭）"],
  "腹筋": ["クランチ","シットアップ","レッグレイズ","ハンギングレッグレイズ","アブローラー","ケーブルクランチ","アブドミナルクランチ（マシン）","ロシアンツイスト","バイシクルクランチ","Vアップ","プランク","サイドプランク","ドラゴンフラッグ"],
  "脚":   ["スクワット","レッグプレス","ブルガリアンスクワット","ランジ","レッグエクステンション","レッグカール","ルーマニアンデッドリフト","ヒップスラスト","カーフレイズ","アダクション","アブダクション"]
};
const KEY = "kintore-log-v1";
let db = load();
let viewMonth = new Date(); viewMonth.setDate(1);
let curDate = null;
let curPart = "胸";

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.logs) return d; }catch(e){}
  return {logs:{}, custom:{}};
}
/* クラウド保存（claude.ai で開いたとき）。各自のデータは本人だけが読める領域に保存 */
let cloud=null, uid=null, pending=new Set(), saveTimer=null, lastSent={};
function save(dateKey){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
  if(!cloud) return;
  pending.add(dateKey===undefined ? curDate : dateKey);
  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 600);
}
async function flush(){
  const keys=[...pending]; pending.clear();
  for(const k of keys){
    if(!k) continue;
    const ref=cloud.collection("data/users/"+uid).doc(k==="_custom"?"custom":"d-"+k);
    const body = k==="_custom" ? {custom:db.custom} : {list:db.logs[k]||[]};
    const js=JSON.stringify(body);
    if(lastSent[k]===js) continue;
    try{
      if(k!=="_custom" && !(db.logs[k]||[]).length) await ref.delete(); else await ref.set(body);
      lastSent[k]=js;
    }catch(e){ toast("クラウド保存に失敗しました"); pending.add(k); }
  }
}
function ask(msg){
  return new Promise(res=>{
    $("dlgMsg").textContent=msg; $("dlg").classList.remove("hidden");
    const done=v=>{ $("dlg").classList.add("hidden"); res(v); };
    $("dlgOk").onclick=()=>done(true); $("dlgNo").onclick=()=>done(false);
  });
}
async function initCloud(){
  if(!window.claude || !claude.use) return;
  const [d,u]=await Promise.all([claude.use("db"), claude.use("user")]);
  if(!d || !u) return;
  const id=await u.id(); if(!id) return;
  cloud=d; uid=id;
  $("syncNote").textContent="クラウドと同期中…";
  const timer=setTimeout(()=>{ $("syncNote").textContent="クラウドに接続できません（この端末に一時保存中）"; },10000);
  let first=true;
  cloud.collection("data/users/"+uid).onSnapshot(snap=>{
    if(snap.metadata.fromCache && first) return;
    clearTimeout(timer);
    $("syncNote").textContent="☁ クラウドに自動保存されます";
    if(first){
      first=false;
      // 初回：この端末にだけある記録をクラウドへ送る
      const remote=new Set(snap.docs.map(x=>x.id));
      Object.keys(db.logs).forEach(k=>{ if(!remote.has("d-"+k) && db.logs[k].length) pending.add(k); });
      if(!remote.has("custom") && Object.keys(db.custom).length) pending.add("_custom");
    }
    snap.docChanges().forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites) return;
      const id=ch.doc.id, data=ch.type==="removed"?null:ch.doc.data();
      if(id==="custom"){ db.custom=data?JSON.parse(JSON.stringify(data.custom||{})):{}; lastSent["_custom"]=JSON.stringify({custom:db.custom}); }
      else if(id.startsWith("d-")){
        const k=id.slice(2);
        if(pending.has(k)) return;
        if(data){ db.logs[k]=JSON.parse(JSON.stringify(data.list||[])); lastSent[k]=JSON.stringify({list:db.logs[k]}); }
        else delete db.logs[k];
      }
    });
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
    if(pending.size){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); }
    if(!$("home").classList.contains("hidden")) renderCal();
    else if(!document.activeElement || document.activeElement.tagName!=="INPUT") renderDay();
  }, e=>{ clearTimeout(timer); $("syncNote").textContent="クラウドに接続できません（この端末に一時保存中）"; });
}
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const rm  = (w,r) => (w>0 && r>0) ? (r===1 ? w : w*(1+r/40)) : 0;   // 1RM推定
const fmt = n => (Math.round(n*100)/100).toLocaleString();
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1600); }

function dayTotals(list){
  let sets=0, reps=0, load=0;
  (list||[]).forEach(ex=>ex.sets.forEach(s=>{
    const w=num(s.w), r=num(s.r);
    if(r>0){ sets++; reps+=r; load+=w*r; }
  }));
  return {ex:(list||[]).length, sets, reps, load};
}
const trained = date => (db.logs[date]||[]).length>0;

/* ---------- カレンダー ---------- */
function renderCal(){
  const y=viewMonth.getFullYear(), m=viewMonth.getMonth();
  $("monthLabel").textContent = `${y}年 ${m+1}月`;
  const g=$("calGrid"); g.innerHTML="";
  "日月火水木金土".split("").forEach(d=>{ const e=document.createElement("div"); e.className="dow"; e.textContent=d; g.appendChild(e); });
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), today=ymd(new Date());
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="day other"; g.appendChild(e); }
  let mDays=0,mSets=0,mLoad=0;
  for(let d=1; d<=days; d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const e=document.createElement("button"); e.className="day"; e.textContent=d;
    if(key===today) e.classList.add("today");
    if(trained(key)){
      e.classList.add("done");
      const t=dayTotals(db.logs[key]); mDays++; mSets+=t.sets; mLoad+=t.load;
    }
    e.onclick=()=>openDay(key);
    g.appendChild(e);
  }
  $("mDays").textContent=mDays; $("mSets").textContent=mSets; $("mLoad").textContent=fmt(mLoad);
}
$("prevM").onclick=()=>{ viewMonth.setMonth(viewMonth.getMonth()-1); renderCal(); };
$("nextM").onclick=()=>{ viewMonth.setMonth(viewMonth.getMonth()+1); renderCal(); };
$("todayBtn").onclick=()=>openDay(ymd(new Date()));

/* ---------- 1日の記録 ---------- */
function openDay(date){
  curDate=date;
  const [y,m,d]=date.split("-");
  $("dayLabel").textContent=`${y}/${m}/${d}`;
  $("home").classList.add("hidden"); $("dayView").classList.remove("hidden");
  window.scrollTo(0,0);
  renderDay();
}
$("backBtn").onclick=()=>{
  if(db.logs[curDate] && !db.logs[curDate].length){ delete db.logs[curDate]; save(curDate); }
  $("dayView").classList.add("hidden"); $("home").classList.remove("hidden");
  const [y,m]=curDate.split("-"); viewMonth=new Date(+y,+m-1,1);
  renderCal();
};

function lastRecord(name){
  const dates=Object.keys(db.logs).filter(d=>d<curDate).sort().reverse();
  for(const d of dates){ const ex=db.logs[d].find(e=>e.name===name); if(ex) return {date:d, ex}; }
  return null;
}

function updateStats(){
  const t=dayTotals(db.logs[curDate]);
  $("sEx").textContent=t.ex; $("sSet").textContent=t.sets; $("sRep").textContent=t.reps; $("sLoad").textContent=fmt(t.load);
}

function renderDay(){
  const list=db.logs[curDate]||[];
  const box=$("list"); box.innerHTML="";
  if(!list.length){
    box.innerHTML=`<div class="empty"><span class="big">NO LIFT YET</span>まだ種目がありません<br>右下の <b style="color:var(--accent)">＋</b> から種目を追加</div>`;
  }
  list.forEach((ex,i)=>{
    const c=document.createElement("div"); c.className="card";
    const prev=lastRecord(ex.name);
    const prevTxt = prev ? `前回 ${prev.date.slice(5).replace("-","/")}：` + prev.ex.sets.filter(s=>num(s.r)>0).map(s=>`${num(s.w)}kg×${num(s.r)}`).join(" / ") : "";
    c.innerHTML=`
      <div class="card-h">
        <span class="name">${esc(ex.name)}</span><span class="part">${esc(ex.part||"")}</span>
        <button data-a="up" ${i===0?"disabled":""}>▲</button>
        <button data-a="down" ${i===list.length-1?"disabled":""}>▼</button>
        <button data-a="delEx">✕</button>
      </div>
      ${prevTxt?`<div class="prev">${esc(prevTxt)}</div>`:""}
      <div class="cols"><span>セット</span><span style="text-align:right">重さ</span><span style="text-align:right">回数</span><span style="text-align:right">RM</span><span></span></div>
      <div class="rows"></div>
      <div class="add-set"><button data-a="addSet">＋ セットを追加</button></div>`;
    const rows=c.querySelector(".rows");
    ex.sets.forEach((s,j)=>{
      const r=document.createElement("div"); r.className="row";
      const ph = prev && prev.ex.sets[j] ? prev.ex.sets[j] : null;
      r.innerHTML=`
        <span class="no">${j+1}</span>
        <span class="w"><input inputmode="decimal" value="${s.w??""}" placeholder="${ph&&ph.w?ph.w:"0"}"><span class="u">kg</span></span>
        <span class="r"><input inputmode="numeric" value="${s.r??""}" placeholder="${ph&&ph.r?ph.r:"0"}"><span class="u">回</span></span>
        <span class="rm">${rm(num(s.w),num(s.r))?fmt(rm(num(s.w),num(s.r)))+"kg":"-"}</span>
        <button class="del">🗑</button>`;
      const [wIn,rIn]=r.querySelectorAll("input");
      const upd=()=>{ s.w=wIn.value; s.r=rIn.value; const v=rm(num(s.w),num(s.r)); r.querySelector(".rm").textContent=v?fmt(v)+"kg":"-"; save(); updateStats(); };
      wIn.oninput=upd; rIn.oninput=upd;
      r.querySelector(".del").onclick=()=>{ ex.sets.splice(j,1); save(); renderDay(); };
      rows.appendChild(r);
    });
    c.querySelector('[data-a="addSet"]').onclick=()=>{
      const last=ex.sets[ex.sets.length-1];
      ex.sets.push({w:last?last.w:"", r:""}); save(); renderDay();
    };
    c.querySelector('[data-a="delEx"]').onclick=()=>{
      ask(`「${ex.name}」を削除しますか？`).then(ok=>{ if(ok){ list.splice(i,1); save(); renderDay(); } });
    };
    c.querySelector('[data-a="up"]').onclick=()=>{ [list[i-1],list[i]]=[list[i],list[i-1]]; save(); renderDay(); };
    c.querySelector('[data-a="down"]').onclick=()=>{ [list[i+1],list[i]]=[list[i],list[i+1]]; save(); renderDay(); };
    box.appendChild(c);
  });
  updateStats();
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- 種目選択 ---------- */
$("fab").onclick=()=>{ $("modal").classList.remove("hidden"); renderTabs(); renderExList(); };
$("closeModal").onclick=()=>$("modal").classList.add("hidden");
$("modal").onclick=e=>{ if(e.target.id==="modal") $("modal").classList.add("hidden"); };

function renderTabs(){
  const t=$("tabs"); t.innerHTML="";
  Object.keys(PARTS).forEach(p=>{
    const b=document.createElement("button"); b.textContent=p; if(p===curPart) b.className="on";
    b.onclick=()=>{ curPart=p; renderTabs(); renderExList(); };
    t.appendChild(b);
  });
}
function renderExList(){
  const box=$("exList"); box.innerHTML="";
  const custom=db.custom[curPart]||[];
  [...custom.map(n=>({n,c:true})), ...PARTS[curPart].map(n=>({n,c:false}))].forEach(({n,c})=>{
    const row=document.createElement("div"); row.className="ex";
    row.innerHTML=`<button class="pick">${esc(n)}${c?'<span class="tag">マイ種目</span>':""}</button>${c?'<button class="rm-ex">🗑</button>':""}`;
    row.querySelector(".pick").onclick=()=>addExercise(n);
    if(c) row.querySelector(".rm-ex").onclick=()=>{
      ask(`マイ種目「${n}」を一覧から削除しますか？（過去の記録は残ります）`).then(ok=>{ if(ok){
        db.custom[curPart]=custom.filter(x=>x!==n); save("_custom"); renderExList();
      }});
    };
    box.appendChild(row);
  });
}
$("addCustom").onclick=()=>{
  const n=$("customName").value.trim(); if(!n) return;
  db.custom[curPart]=db.custom[curPart]||[];
  if(db.custom[curPart].includes(n)||PARTS[curPart].includes(n)){ toast("すでにあります"); return; }
  db.custom[curPart].unshift(n); save("_custom"); $("customName").value=""; renderExList(); toast(`「${n}」を追加しました`);
};
function addExercise(name){
  db.logs[curDate]=db.logs[curDate]||[];
  const prev=lastRecord(name);
  const sets=[0,1,2].map(i=>({w: prev&&prev.ex.sets[i]?prev.ex.sets[i].w:"", r:""}));
  db.logs[curDate].push({name, part:curPart, sets});
  save(); $("modal").classList.add("hidden"); renderDay();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50);
}

/* ---------- バックアップ ---------- */
$("exportBtn").onclick=async()=>{
  const json=JSON.stringify(db,null,1), name=`kintore-backup-${ymd(new Date())}.json`;
  const dl = window.claude && claude.use ? await claude.use("downloads") : null;
  if(dl){ try{ await dl.save({filename:name, data:json}); }catch(e){} return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download=name; a.click();
};
$("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{
    try{ const d=JSON.parse(t); if(!d.logs) throw 0;
      ask("現在のデータを置き換えて読み込みますか？").then(ok=>{ if(!ok) return;
        const old=Object.keys(db.logs); db={logs:d.logs, custom:d.custom||{}};
        new Set([...old,...Object.keys(db.logs)]).forEach(k=>save(k)); save("_custom");
        renderCal(); toast("読み込みました"); });
    }catch(_){ toast("ファイルが正しくありません"); }
  });
  e.target.value="";
};

renderCal();
initCloud();
</script>
