<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --paper:#17202b; --ink:#e6edf5; --sub:#97a6b8; --line:#2a3644;
  --signal:#5aa9ff; --signal-soft:#16304d; --use:#ff9d5c; --use-soft:#3a2416; --ok:#4cc982; --ng:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --paper:#17202b; --ink:#e6edf5; --sub:#97a6b8; --line:#2a3644;
  --signal:#5aa9ff; --signal-soft:#16304d; --use:#ff9d5c; --use-soft:#3a2416; --ok:#4cc982; --ng:#ff7b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.ant{display:flex;align-items:flex-end;gap:3px;height:20px}
.ant i{display:block;width:5px;background:var(--line);border-radius:1px}
.ant i.on{background:var(--signal)}
.antwrap{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-size:28px;line-height:1.2;margin:0;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.08em;margin-top:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.chip{background:var(--signal-soft);color:var(--signal);font-weight:800;padding:2px 10px;border-radius:999px;letter-spacing:.06em}
.date{color:var(--sub);font-family:var(--f-mono)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.4;margin:0;text-wrap:balance}
.body{margin:0}
.use{background:var(--use-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.use b{color:var(--use);font-size:12px;letter-spacing:.1em}
.quiz{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.quiz .qlabel{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--signal)}
.quiz p{margin:0;font-weight:600}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:800}
.opt.wrong{border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.opt:disabled{cursor:default}
.result{font-weight:800;min-height:1.5em;margin:0}
.result.ok{color:var(--ok)} .result.ng{color:var(--ng)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;background:transparent;color:var(--signal);border:1.5px solid var(--signal);border-radius:999px;padding:6px 16px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn.solid{background:var(--signal);color:var(--paper)}
section h3{font-size:14px;letter-spacing:.1em;color:var(--sub);margin:0 0 8px;font-weight:800}
.teaser{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.teaser .day{font-family:var(--f-display);font-size:22px;color:var(--signal);min-width:2.2em;text-align:center}
.teaser .tt{min-width:0}
.teaser .tt span{display:block;font-size:12px;color:var(--sub)}
.blur{filter:blur(5px);user-select:none}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.row{font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
.row .d{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px}
.mark.done{color:var(--ok);border:1px solid var(--ok)}
.mark.miss{color:var(--use);border:1px solid var(--use)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.week{font-size:13px;color:var(--sub);margin:0}
.empty{padding:14px;color:var(--sub);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const CARDS={
"通信":[
{t:"5Gの3つの特徴",b:"5Gは「高速・大容量」「低遅延」「多数同時接続」の3つが売り。4Gの延長ではなく、工場の機械制御や遠隔医療など“人以外”がつながる世界を想定している。",u:"法人のお客さんに「5Gで何が変わるの？」と聞かれたとき、3つを指折りで言えると一気に信頼される。",q:"5Gの特徴に含まれないのは？",o:["低遅延","多数同時接続","通話料無料"],a:2},
{t:"MNOとMVNOの違い",b:"MNOは自前で基地局を持つ通信事業者（ドコモ・au・ソフトバンク・楽天モバイル）。MVNOは回線を借りてサービスを売る事業者で、いわゆる格安SIM。",u:"「格安SIMと何が違うの？」は営業現場の定番質問。品質と価格の理由を構造で説明できる。",q:"自前で基地局を持つのは？",o:["MNO","MVNO","ISP"],a:0},
{t:"プラチナバンド",b:"700〜900MHz帯の電波のこと。周波数が低い電波は回り込みやすく、建物の奥や山間部にも届きやすい。だから“つながりやすさ”に直結し、各社が欲しがる。",u:"「地下で電波が弱い」という相談に、周波数の話で理由を説明できる。",q:"プラチナバンドの強みは？",o:["届きやすい","速度が最速","電池が長持ち"],a:0},
{t:"光回線のしくみ",b:"光ファイバーはガラスの細い線の中で光を全反射させて信号を運ぶ。電気より減衰が少なく、長距離でも高速。家まで光を引く方式をFTTH（Fiber To The Home）という。",u:"固定回線の提案で「なぜ光は速いのか」を一言で言える。",q:"光ファイバーが信号を運ぶ原理は？",o:["全反射","静電気","磁力"],a:0},
{t:"光コラボレーション",b:"NTT東西の光回線を他社が借りて自社ブランドで売るモデル（2015年開始）。ドコモ光・ソフトバンク光などがこれ。回線自体は同じでも、料金やセット割が違う。",u:"「〇〇光と△△光、何が違うの？」に「回線は同じ、違うのはサービスと割引」と答えられる。",q:"光コラボで借りているのは主に誰の回線？",o:["NTT東西","電力会社","海外事業者"],a:0},
{t:"MNP（番号ポータビリティ）",b:"電話番号はそのままで携帯会社を乗り換えられる制度。日本では2006年に開始。今はワンストップ方式で、乗り換え先だけで手続きが完結しやすくなった。",u:"乗り換え提案の第一関門は「番号変わるの？」。即答できると話が進む。",q:"MNPで変わらないものは？",o:["電話番号","料金プラン","契約会社"],a:0},
{t:"eSIM",b:"スマホに内蔵されたSIM。カードの差し替え不要で、オンラインで回線を切り替えられる。1台で2回線（仕事用・私用）を持つデュアルSIM運用もしやすい。",u:"「社用と私用でスマホ2台持ちがつらい」という声にeSIMで1台化を提案できる。",q:"eSIMの説明で正しいのは？",o:["本体内蔵のSIM","Wi-Fi専用機能","5G専用のSIM"],a:0},
{t:"ローカル5G",b:"通信キャリアではなく企業や自治体が、自分の敷地内だけで使う専用の5G網を作れる制度。工場や港湾、スタジアムなどで使われる。",u:"製造業の法人営業で「工場のWi-Fiが不安定」という課題が出たら候補になる。",q:"ローカル5Gを運用できるのは？",o:["企業や自治体","個人のみ","海外キャリアのみ"],a:0},
{t:"IoTとLPWA",b:"IoTはモノがネットにつながること。LPWAは「省電力・広範囲・低速」の通信方式で、電池で何年も動くセンサー（水道メーター、見守りなど）向き。速さより省電力が大事な場面で使う。",u:"「毎日少しデータを送るだけ」の案件に5Gではなく適材適所を提案できる。",q:"LPWAが得意なのは？",o:["省電力で広範囲","動画配信","低遅延ゲーム"],a:0},
{t:"VPN",b:"インターネット上に仮想の専用線をつくり、暗号化して安全に通信するしくみ。本社と支店、在宅勤務と社内システムをつなぐのに使う。",u:"テレワーク導入企業への提案で必ず出てくる単語。",q:"VPNの主な目的は？",o:["安全な通信路をつくる","通信を無料にする","電波を強くする"],a:0},
{t:"クラウドとオンプレ",b:"オンプレミスは自社でサーバーを持つ形、クラウドはネット経由で借りる形。クラウドは初期費用が小さく拡張しやすいが、通信回線の品質がより重要になる。",u:"「クラウド移行するなら回線も見直しませんか」という流れで回線提案につなげられる。",q:"自社でサーバーを持つ形は？",o:["オンプレミス","クラウド","SaaS"],a:0},
{t:"IP電話と050番号",b:"インターネット回線で音声を送る電話。050で始まる番号はIP電話用。0AB-J番号（03など市外局番から始まる番号）は品質基準を満たした固定電話に割り当てられる。",u:"オフィス移転の相談で「番号を変えずに済むか」の判断材料になる。",q:"050で始まる番号は？",o:["IP電話","携帯電話","フリーダイヤル"],a:0},
{t:"固定電話網のIP化",b:"NTTの固定電話網（PSTN）は2024〜2025年にかけてIP網へ移行した。同時にISDN（INSネット）のデータ通信モードも終了し、古い仕組みを使う企業は切り替えが必要になった。",u:"古いPOSやFAX、警備システムを使う企業への提案のきっかけになる。",q:"固定電話網は何へ移行した？",o:["IP網","衛星網","アナログ網"],a:0},
{t:"Wi-Fiの規格名",b:"Wi-Fi 6、Wi-Fi 6E、Wi-Fi 7と世代で呼ぶ。新しいほど速く、混雑に強い。6Eと7は6GHz帯も使えて、電波の渋滞が起きにくい。",u:"「オフィスのWi-Fiが遅い」原因の一つは古いルーター。世代の話で提案できる。",q:"6GHz帯が使えるのは？",o:["Wi-Fi 6E以降","Wi-Fi 4","Wi-Fi 5"],a:0},
{t:"通信速度の単位",b:"bps（ビット毎秒）で表す。1Gbps＝1000Mbps。ファイルサイズのB（バイト）とは8倍違う。100MBのファイルは理論上100Mbpsで約8秒。",u:"「1Gbpsって何がどれくらい速いの？」を具体例で答えられる。",q:"1バイトは何ビット？",o:["8ビット","10ビット","2ビット"],a:0},
{t:"ベストエフォート",b:"「最大〇Gbps」は理論上の最大値で、実際の速度は保証しないという意味。混雑や距離で変わる。帯域保証型サービスは高いが速度が保証される。",u:"「表示ほど速度が出ない」というクレームに正しく説明できる。",q:"ベストエフォートの意味は？",o:["最大値で保証なし","速度を保証","常に最大速度"],a:0},
{t:"SD-WAN",b:"多数の拠点のネットワークをソフトウェアで一元管理するしくみ。通信の種類ごとに経路を自動で振り分け、クラウド利用時の遅さを解消しやすい。",u:"多店舗展開の企業（小売・飲食）への法人提案で出てくる。",q:"SD-WANの“SD”は？",o:["Software-Defined","Super Data","Secure Device"],a:0},
{t:"6Gの話題",b:"2030年頃の実用化を目指す次世代通信。空・海・宇宙までカバーすることや、5Gよりさらに速く低遅延を目指している。日本ではIOWN（光で処理する次世代網）構想も進む。",u:"業界研究の話題として、先輩や取引先との雑談に使える。",q:"6Gの実用化目標はいつ頃？",o:["2030年頃","2020年","2050年"],a:0},
{t:"衛星通信",b:"低軌道衛星を使った通信が広がり、山間部や海上、災害時にもつながる手段になっている。スマホと衛星が直接つながるサービスも国内で始まった。",u:"建設・物流・自治体の「圏外エリア」課題に提案の幅が広がる。",q:"近年広がる衛星通信の衛星は？",o:["低軌道衛星","月","気象衛星のみ"],a:0},
{t:"SIMロックの原則禁止",b:"2021年10月から、新しく売る携帯電話へのSIMロックは原則禁止になった。買った端末を他社でもそのまま使える。",u:"「この端末、他社で使える？」の質問に即答できる。",q:"SIMロックが原則禁止になったのは？",o:["2021年","2006年","2015年"],a:0},
{t:"オンライン専用プラン",b:"2021年に各社が始めたahamo・povo・LINEMOなどは、店舗サポートを絞って安くしたプラン。安さとサポートの手厚さはトレードオフ。",u:"お客さんに合うのは安さか安心か、ヒアリングの軸になる。",q:"オンライン専用プランが安い理由の一つは？",o:["店舗サポートを絞る","電波が弱い","通話できない"],a:0},
{t:"通信の秘密",b:"電気通信事業法で、通信事業者は通信の内容や相手を漏らしてはいけないと定められている。社員一人ひとりにも守る義務がある、業界の最重要ルール。",u:"入社後の研修で必ず出る。「なぜ厳しいのか」を先に知っておくと理解が早い。",q:"通信の秘密を定める法律は？",o:["電気通信事業法","道路交通法","著作権法"],a:0}
],
"営業":[
{t:"売るより先に聞く",b:"トップ営業ほど話す時間より聞く時間が長い。相手の困りごとが分かれば、提案は「説明」ではなく「解決策」になる。目安は聞く7：話す3。",u:"初回訪問で緊張したら「今日は教えてもらう日」と決めると楽になる。",q:"初回訪問で意識したい比率は？",o:["聞く7：話す3","聞く1：話す9","半々"],a:0},
{t:"オープン質問とクローズド質問",b:"「はい/いいえ」で答える質問がクローズド、自由に話せるのがオープン。最初はオープンで広げ、最後はクローズドで確認する。",u:"「今の回線に不満はありますか？」より「回線で困る場面ってどんな時ですか？」の方が話が広がる。",q:"話を広げやすいのは？",o:["オープン質問","クローズド質問","誘導質問"],a:0},
{t:"SPIN話法",b:"Situation（状況）→Problem（問題）→Implication（その問題の影響）→Need-payoff（解決したら何が良くなるか）の順に質問する手法。相手が自分で必要性に気づく。",u:"「Wi-Fiが遅い→会議が止まる→商談を逃す→直れば成約率が上がる」と流れで聞ける。",q:"SPINの“I”は？",o:["影響（Implication）","情報（Information）","意図（Intention）"],a:0},
{t:"BANT",b:"Budget（予算）・Authority（決裁者）・Needs（必要性）・Timeline（導入時期）。この4つが揃っている案件は決まりやすい。法人営業の案件管理の基本。",u:"上司に「その案件の決裁者は？」と聞かれて詰まらないために。",q:"BANTの“A”は？",o:["決裁者","広告","分析"],a:0},
{t:"決裁者を見つける",b:"担当者が乗り気でも、最終的に決めるのは別の人ということが多い。「導入を決めるのはどなたですか」「社内ではどんな流れで決まりますか」と早めに聞く。",u:"何度通っても決まらない案件の多くは、決裁者に話が届いていない。",q:"決まらない案件で多い原因は？",o:["決裁者に届いていない","資料が多すぎる","名刺が古い"],a:0},
{t:"メリットではなくベネフィット",b:"「通信速度が2倍」は機能（メリット）。「会議が止まらずお客様を待たせない」がベネフィット。人は機能ではなく、自分にとっての良い変化で決める。",u:"提案書の見出しを「〇〇できるようになります」で書くと刺さる。",q:"ベネフィットに当たるのは？",o:["会議が止まらない","速度2倍","最新規格"],a:0},
{t:"反論は質問で返す",b:"「高いね」と言われたら値引きの前に「何と比べて高いと感じますか？」と聞く。反論の裏には別の本音（予算時期、比較相手、不安）が隠れていることが多い。",u:"価格で断られそうな時、即値引きせず一度質問で掘る。",q:"「高い」と言われた時の最初の一手は？",o:["理由を質問する","すぐ値引き","黙る"],a:0},
{t:"テストクロージング",b:"最後に「どうしますか？」と聞く前に、途中で「もし導入するなら、いつ頃からが良いですか？」と小さく確認する。相手の温度感が分かり、最後の一押しが自然になる。",u:"提案の途中で一度入れると、クロージングの怖さが減る。",q:"テストクロージングの目的は？",o:["温度感を確かめる","契約を迫る","雑談する"],a:0},
{t:"次の約束を決めて帰る",b:"商談の最後に「次回は〇日に見積をお持ちします」と次の予定を決めて帰る。決めずに帰ると、案件は自然に冷める。",u:"どんな商談でも、帰る前に「次の一歩」を必ず一つ決める。",q:"商談の最後にすべきことは？",o:["次の予定を決める","雑談で終える","資料だけ置く"],a:0},
{t:"アップセルとクロスセル",b:"アップセルは上位プランへの切り替え、クロスセルは別商品の追加（回線＋セキュリティなど）。新規開拓より既存顧客への提案の方が成功率は高い。",u:"既存顧客の訪問は「困りごとが増えていないか」を聞くチャンス。",q:"回線契約にセキュリティを追加するのは？",o:["クロスセル","アップセル","ダウンセル"],a:0},
{t:"返報性の原理",b:"人は何かをしてもらうと返したくなる。役立つ情報や小さな手助けを先に渡す営業は、後で話を聞いてもらいやすい。",u:"訪問時に相手の業界ニュースを一つ持っていくだけでも効果がある。",q:"先に与えると返したくなる心理は？",o:["返報性","希少性","権威"],a:0},

{t:"アンカリング",b:"最初に見た数字が判断の基準（いかり）になる心理。上位プランから見せると、標準プランが手頃に感じられる。",u:"プランを紹介する順番を意識するだけで印象が変わる。",q:"最初の数字が基準になる効果は？",o:["アンカリング","バンドワゴン","ザイオンス"],a:0},

{t:"損失回避",b:"人は得をする喜びより、損をする痛みを約2倍強く感じると言われる。「このままだと年〇万円の無駄」は「〇万円得します」より響きやすい。",u:"コスト削減提案では「今失っている額」を見える化する。",q:"人がより強く感じやすいのは？",o:["損をする痛み","得をする喜び","どちらも同じ"],a:0},

{t:"ヒアリングシートを作る",b:"毎回聞く項目（現状の回線・台数・契約更新月・不満・決裁者）を一枚にまとめておく。聞き漏れが減り、2回目の訪問が楽になる。",u:"配属初月に自分用のシートを作るだけで先輩との差が縮まる。",q:"ヒアリングシートの効果は？",o:["聞き漏れが減る","契約が自動で取れる","訪問が不要になる"],a:0},

{t:"パイプライン管理",b:"案件を「見込み→提案→見積→交渉→成約」の段階で管理する。各段階に何件あるかで、来月の数字が予測できる。",u:"月末に慌てないための考え方。配属後すぐ役立つ。",q:"パイプライン管理で分かることは？",o:["今後の成約見込み","顧客の住所","競合の売上"],a:0},

{t:"固定費と変動費",b:"固定費は売上に関係なくかかる費用（家賃・人件費）。変動費は売上に比例する費用（仕入れ・手数料）。固定費の大きい会社ほど、通信費などの削減提案に関心がある。",u:"お客さんのコスト削減の話で「それは固定費ですね」と整理できる。",q:"家賃はどちら？",o:["固定費","変動費","どちらでもない"],a:0},
{t:"損益分岐点",b:"売上と費用がちょうど同じになり、利益がゼロになる売上額。これを超えると黒字。お客さんがよく使う考え方なので知っておくと会話が噛み合う。",u:"経営者と話す時に「損益分岐点が下がりますね」は刺さる言葉。",q:"損益分岐点での利益は？",o:["ゼロ","最大","マイナス"],a:0},
{t:"税込と税抜",b:"消費税は標準10%。法人向けは税抜価格で話すことが多い。見積や提案で税込・税抜が混ざると大きなトラブルになる。",u:"見積を出す時は必ず「税抜/税込」を明記する。",q:"法人向けの見積でよく使うのは？",o:["税抜表示","税込のみ","どちらも書かない"],a:0},
{t:"見積書・発注書・請求書",b:"見積書（いくらでできるか）→発注書（お願いします）→納品→請求書（払ってください）の流れ。どの書類がいつ出るかを知っておくと、事務処理で迷わない。",u:"配属直後に必ず触る書類。順番だけ先に覚える。",q:"請求書が出るのはいつ？",o:["納品の後","見積の前","発注の前"],a:0},
{t:"締め日と支払日",b:"「月末締め翌月末払い」は、今月分の請求をまとめて翌月末に払うという意味。法人取引ではこれが一般的で、お金が入るまで時間がかかる。",u:"お客さんの経理担当と話す時の基本用語。",q:"「月末締め翌月末払い」で10月分が払われるのは？",o:["11月末","10月末","12月末"],a:0},

};
const START=new Date(2026,10,3); // 2026/11/3(火)
const JOIN=new Date(2027,3,1);
const WD=["日","月","火","水","木","金","土"];
const CAT=[null,"通信","営業","マナー","雑学","お金","仕事術"];
const DAY=86400000;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seen=store.get("dpj_seen",{}), answers=store.get("dpj_ans",{});
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const fmt=d=>(d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")";
const diff=(a,b)=>Math.round((b-a)/DAY);
function cardFor(d){
  const w=d.getDay();
  if(w===0)return{review:true};
  const off=(w-START.getDay()+7)%7, n=Math.floor((diff(START,d)-off)/7);
  const list=CARDS[CAT[w]];const c=list[((n%list.length)+list.length)%list.length];
  return Object.assign({cat:CAT[w],id:CAT[w]+":"+list.indexOf(c)},c);
}
function seeded(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return()=>{h=(h*1103515245+12345)|0;return((h>>>0)%1000)/1000}}
function shuffled(c,salt){const r=seeded(c.t+salt);const idx=c.o.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
let viewing=today0();
function render(){
  const t=today0(); if(viewing<START)viewing=new Date(START); if(viewing>t)viewing=new Date(t);
  seen[key(viewing)]=true; store.set("dpj_seen",seen);
  const el=document.getElementById("card"), c=cardFor(viewing);
  if(c.review){renderReview(el,viewing)}else{renderCard(el,c,viewing)}
  document.getElementById("prev").disabled=diff(START,viewing)<=0;
  renderSide();
}
function renderCard(el,c,d){
  el.innerHTML=`<div class="meta"><span class="chip">${c.cat}</span><span class="date">${fmt(d)}${diff(d,today0())===0?" 今日":""}</span></div>
  <h2>${c.t}</h2><p class="body">${c.b}</p>
  <div class="use"><b>こんな時に使える</b><span>${c.u}</span></div>
  <div class="quiz"><span class="qlabel">1問クイズ</span><p>${c.q}</p><div class="opts"></div><p class="result" role="status"></p></div>`;
  mountQuiz(el.querySelector(".quiz"),c,key(d));
}
function mountQuiz(box,c,salt){
  const opts=box.querySelector(".opts"),res=box.querySelector(".result");
  const prev=answers[c.id+"@"+salt];
  shuffled(c,salt).forEach(i=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=c.o[i];b.dataset.i=i;opts.appendChild(b)});
  const show=(pick)=>{opts.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===c.a)b.classList.add("right");else if(i===pick)b.classList.add("wrong")});
    if(pick===c.a){res.textContent="正解！ 電波1本ゲット";res.className="result ok"}else{res.textContent="おしい。正解は「"+c.o[c.a]+"」";res.className="result ng"}};
  if(prev!==undefined)show(prev);
  opts.addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const p=+b.dataset.i;answers[c.id+"@"+salt]=p;store.set("dpj_ans",answers);show(p);renderSide()});
}
function renderReview(el,d){
  const past=[];for(let i=6;i>=1;i--){const x=new Date(d.getTime()-i*DAY);if(x>=START){const c=cardFor(x);if(!c.review)past.push(c)}}
  el.innerHTML=`<div class="meta"><span class="chip">復習</span><span class="date">${fmt(d)}${diff(d,today0())===0?" 今日":""}</span></div>
  <h2>今週の${past.length}問、全部解けるか</h2><p class="body">月〜土に出たカードからの出題です。忘れていたら、下の「これまでのカード」で読み直せます。</p>`;
  if(!past.length){el.insertAdjacentHTML("beforeend",'<p class="empty">今週はまだカードがありません。明日から始まります。</p>');return}
  past.forEach(c=>{const q=document.createElement("div");q.className="quiz";q.innerHTML=`<span class="qlabel">${c.cat}｜${c.t}</span><p>${c.q}</p><div class="opts"></div><p class="result" role="status"></p>`;el.appendChild(q);mountQuiz(q,c,"rev"+key(d))});
}
function streak(){let s=0,d=today0();if(!seen[key(d)])d=new Date(d.getTime()-DAY);while(d>=START&&seen[key(d)]){s++;d=new Date(d.getTime()-DAY)}return s}
function renderSide(){
  const t=today0(), dj=diff(t,JOIN);
  document.getElementById("countdown").textContent=dj>0?"入社まであと "+dj+" 日":"社会人 "+(1-dj)+" 日目";
  const s=streak();document.getElementById("streakTxt").textContent="連続"+s+"日";
  document.querySelectorAll("#ant i").forEach((b,i)=>b.classList.toggle("on",i<Math.min(s,5)));
  const tm=new Date(t.getTime()+DAY),nc=cardFor(tm),tz=document.getElementById("teaser");
  tz.innerHTML=nc.review?`<span class="day">${WD[tm.getDay()]}</span><div class="tt"><span>${fmt(tm)}</span>1週間の復習クイズ。今日までのカードを覚えておこう</div>`
    :`<span class="day">${WD[tm.getDay()]}</span><div class="tt"><span>${fmt(tm)}｜${nc.cat}</span><span class="blur" aria-hidden="true">${nc.t}</span>タイトルは明日のお楽しみ</div>`;
  let total=0,correct=0,days=0;
  for(const k in answers){total++;const [id]=k.split("@");const [cat,idx]=id.split(":");const c=CARDS[cat]&&CARDS[cat][idx];if(c&&answers[k]===c.a)correct++}
  for(const k in seen)days++;
  document.getElementById("stats").innerHTML=`<div class="stat"><b>${days}</b><span>開いた日</span></div><div class="stat"><b>${correct}/${total}</b><span>正解/回答</span></div><div class="stat"><b>${s}</b><span>連続日数</span></div>`;
  const miss=document.getElementById("missed"),arch=document.getElementById("archive");miss.innerHTML="";arch.innerHTML="";
  for(let d=new Date(t);d>=START;d=new Date(d.getTime()-DAY)){
    const c=cardFor(d),k=key(d),row=document.createElement("button");row.type="button";row.className="row";
    const done=!!seen[k];
    row.innerHTML=`<span class="d">${fmt(d)}</span><span class="t">${c.review?"1週間の復習":c.cat+"｜"+c.t}</span><span class="mark ${done?"done":"miss"}">${done?"済":"未"}</span>`;
    const dd=new Date(d);row.addEventListener("click",()=>{viewing=dd;render();window.scrollTo({top:0,behavior:"smooth"})});
    arch.appendChild(row);
    if(!done){const r2=row.cloneNode(true);r2.addEventListener("click",()=>{viewing=dd;render();window.scrollTo({top:0,behavior:"smooth"})});miss.appendChild(r2)}
  }
  if(!miss.children.length)miss.innerHTML='<p class="empty">取りこぼしはありません。この調子。</p>';
}
document.getElementById("prev").addEventListener("click",()=>{viewing=new Date(viewing.getTime()-DAY);render()});
document.getElementById("todayBtn").addEventListener("click",()=>{viewing=today0();render()});
render();
</script>
